name: W13 original-free Linux capability

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  original_free_capability:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Kyu-Sung-Cho/wedding-hanbang-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No checkout, setup action, cache, upload artifact, secret, DB, or image download.
      - name: Measure only disposable Linux protections
        shell: bash
        run: |
          #!/usr/bin/env bash
          # Original-free capability probe only. No checkout, credentials, DB, images, or original inputs.
          set -euo pipefail
          umask 077
          [[ "${GITHUB_ACTIONS:-}" == true && "${RUNNER_OS:-}" == Linux && "${GITHUB_REPOSITORY:-}" == Kyu-Sung-Cho/wedding-hanbang-web ]] || { printf '%s\n' 'W13_CAPABILITY_SCOPE_REQUIRED'; exit 2; }
          for name in $(compgen -e); do
            case "$name" in SUPABASE*|DATABASE_URL|PGPASSWORD|PGSERVICE*|AWS_*|AZURE_CLIENT_SECRET|BACKUP_*|RESTORE_KEY*) printf '%s\n' 'W13_CREDENTIAL_ENV_NOT_ALLOWED'; exit 2;; esac
          done
          for tool in sudo timeout unshare mount umount findmnt ip python3 swapoff; do command -v "$tool" >/dev/null || { printf '%s\n' 'W13_REQUIRED_TOOL_UNAVAILABLE'; exit 2; }; done
          sudo -n true
          work=$(mktemp -d /tmp/w13-capability.XXXXXXXX)
          [[ "$work" == /tmp/w13-capability.* && ! -L "$work" ]] || exit 2
          cleanup() {
            # Exact files created below only; no recursive deletion and no shared cache/artifact changes.
            /bin/rm -f -- "$work/probe.py" "$work/child.sh"
            /bin/rmdir -- "$work/scratch" "$work"
          }
          trap cleanup EXIT
          mkdir -- "$work/scratch"
          cat > "$work/probe.py" <<'PY'
          import ctypes, errno, json, mmap, os, pathlib, re, resource, socket, stat, subprocess

          checks = {}
          facts = {}
          root = pathlib.Path(os.environ['W13_PROBE_ROOT'])

          def require(value, code):
              checks[code] = bool(value)
              if not value:
                  raise RuntimeError(code)

          def command(*args):
              return subprocess.check_output(args, timeout=5, text=True).strip()

          def denied(family, protocol, address):
              with socket.socket(family, protocol) as s:
                  s.settimeout(2)
                  try:
                      if protocol == socket.SOCK_DGRAM:
                          s.sendto(b'W13 synthetic no-route probe', address)
                      else:
                          s.connect(address)
                  except OSError as error:
                      return error.errno in (errno.ENETUNREACH, errno.EHOSTUNREACH, errno.EADDRNOTAVAIL)
                  return False

          try:
              facts['memoryTotalBytes'] = int(re.search(r'^MemTotal:\s+(\d+)', pathlib.Path('/proc/meminfo').read_text(), re.M)[1]) * 1024
              facts['memoryAvailableBytes'] = int(re.search(r'^MemAvailable:\s+(\d+)', pathlib.Path('/proc/meminfo').read_text(), re.M)[1]) * 1024
              fs = os.statvfs('/tmp')
              facts['diskAvailableBytes'] = fs.f_bavail * fs.f_frsize
              facts['kernel'] = os.uname().release
              facts['swapDevices'] = max(0, len(pathlib.Path('/proc/swaps').read_text().strip().splitlines()) - 1)
              require(facts['swapDevices'] == 0, 'swapDisabledObserved')
              require(os.readlink('/proc/self/ns/net') != os.environ['W13_PARENT_NETNS'], 'separateNetworkNamespace')
              require(sorted(row['ifname'] for row in json.loads(command('ip', '-j', 'link', 'show'))) == ['lo'], 'loopbackOnly')
              ipv4 = json.loads(command('ip', '-j', 'route', 'show', 'default'))
              ipv6 = json.loads(command('ip', '-j', '-6', 'route', 'show', 'default'))
              require(not ipv4 and not ipv6, 'noDefaultRoutes')
              with socket.socket() as server, socket.socket() as client:
                  server.bind(('127.0.0.1', 0))
                  server.listen(1)
                  client.settimeout(2)
                  client.connect(server.getsockname())
                  accepted, _ = server.accept()
                  with accepted:
                      client.sendall(b'W13')
                      require(accepted.recv(3) == b'W13', 'internalLoopbackRoundtrip')
              require(denied(socket.AF_INET, socket.SOCK_STREAM, ('1.1.1.1', 443)), 'externalTcpDenied')
              require(denied(socket.AF_INET, socket.SOCK_DGRAM, ('1.1.1.1', 53)), 'externalDnsUdpDenied')
              require(denied(socket.AF_INET6, socket.SOCK_STREAM, ('2606:4700:4700::1111', 443)), 'externalIpv6TcpDenied')
              scratch = root / 'scratch'
              require(command('findmnt', '-n', '-o', 'FSTYPE', '-T', str(scratch)) == 'tmpfs', 'temporaryMemoryFilesystem')
              options = set(command('findmnt', '-n', '-o', 'OPTIONS', '-T', str(scratch)).split(','))
              require({'nosuid', 'nodev', 'noexec'} <= options, 'temporaryFilesystemRestrictions')
              require(stat.S_IMODE(scratch.stat().st_mode) == 0o700, 'temporaryDirectoryMode700')
              test_file = scratch / 'synthetic-only.txt'
              body = b'W13 synthetic capability bytes\n'
              with test_file.open('xb') as out:
                  out.write(body)
              require(test_file.read_bytes() == body and stat.S_IMODE(test_file.stat().st_mode) == 0o600, 'temporaryPrivateFileRoundtrip')
              test_file.unlink()
              resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
              require(resource.getrlimit(resource.RLIMIT_CORE) == (0, 0), 'processCoreLimitZero')
              libc = ctypes.CDLL(None, use_errno=True)
              libc.prctl.argtypes = [ctypes.c_int, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong]
              libc.prctl.restype = ctypes.c_int
              require(libc.prctl(4, 0, 0, 0, 0) == 0 and libc.prctl(3, 0, 0, 0, 0) == 0, 'processDumpableDisabled')
              size = 8 * 1024 * 1024
              resource.setrlimit(resource.RLIMIT_MEMLOCK, (size, size))
              with mmap.mmap(-1, size, flags=mmap.MAP_PRIVATE | mmap.MAP_ANONYMOUS) as region:
                  region.write(b'W13')
                  address = ctypes.addressof(ctypes.c_char.from_buffer(region))
                  libc.mlock.argtypes = [ctypes.c_void_p, ctypes.c_size_t]
                  libc.mlock.restype = ctypes.c_int
                  libc.munlock.argtypes = [ctypes.c_void_p, ctypes.c_size_t]
                  libc.munlock.restype = ctypes.c_int
                  require(libc.mlock(address, size) == 0, 'memoryLockProbeSucceeded')
                  try:
                      region.madvise(mmap.MADV_DONTDUMP)
                      locked = int(re.search(r'^VmLck:\s+(\d+)', pathlib.Path('/proc/self/status').read_text(), re.M)[1]) * 1024
                      require(locked >= size, 'memoryLockObserved')
                      flags = None
                      current = False
                      for line in pathlib.Path('/proc/self/smaps').read_text().splitlines():
                          header = re.match(r'^([a-f0-9]+)-([a-f0-9]+) ', line)
                          if header:
                              current = int(header[1], 16) <= address < int(header[2], 16)
                          elif current and line.startswith('VmFlags:'):
                              flags = line.split()[1:]
                              break
                      require(flags is not None and 'dd' in flags, 'memoryDontDumpObserved')
                      facts['lockedProbeBytes'] = size
                  finally:
                      require(libc.munlock(address, size) == 0, 'memoryUnlockSucceeded')
              require(not list(scratch.iterdir()), 'temporaryDataRemoved')
              result = {'kind': 'w13-github-original-free-capability-v1', 'checks': checks, 'facts': facts, 'capabilityChecksPassed': True}
          except Exception as error:
              result = {'kind': 'w13-github-original-free-capability-v1', 'checks': checks, 'facts': facts, 'capabilityChecksPassed': False, 'errorType': type(error).__name__}
          result.update(sourceDataIncluded=False, credentialsRead=False, fullRestoreVerified=False, originalDataAdmissionAllowed=False)
          print(json.dumps(result, separators=(',', ':')), flush=True)
          raise SystemExit(0 if result['capabilityChecksPassed'] else 1)
          PY
          cat > "$work/child.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          mount --make-rprivate /
          ip link set lo up
          mount -t tmpfs -o size=16m,nodev,nosuid,noexec,mode=0700 tmpfs "$W13_PROBE_ROOT/scratch"
          trap 'umount -- "$W13_PROBE_ROOT/scratch"' EXIT
          python3 "$W13_PROBE_ROOT/probe.py"
          SH
          # This changes swap only on the new disposable GitHub job VM. No Windows changes.
          sudo -n timeout --signal=TERM --kill-after=5s 30s swapoff -a
          parent_netns=$(readlink /proc/self/ns/net)
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin W13_PROBE_ROOT="$work" W13_PARENT_NETNS="$parent_netns" \
            timeout --signal=TERM --kill-after=5s 180s unshare --mount --net --pid --fork --mount-proc /bin/bash "$work/child.sh"
          printf '%s\n' 'W13_CAPABILITY_NAMESPACE_EXITED sourceDataIncluded=false fullRestoreVerified=false originalDataAdmissionAllowed=false'
