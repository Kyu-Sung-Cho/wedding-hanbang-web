name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local quality gate
        run: pnpm qa:local
        env:
          # Placeholder values keep CI focused on static verification and build integrity.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_key
          # OpenAI adapter tests inject a fake client. Keep the production cutover off in CI.
          AMORA_OPENAI_ENABLED: "false"
          RESEND_API_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://hanbang.ai
          ADMIN_PASSWORD: placeholder
          DECART_API_KEY: placeholder
          NAVER_CLIENT_ID: placeholder
          NAVER_CLIENT_SECRET: placeholder

      - name: Supabase release manifest fence
        run: pnpm supabase:release:fence

  windows-backup:
    name: Windows Backup Safety Gate
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed isolated project-ref fence for the fake CLI harness
        shell: pwsh
        run: |
          $refDirectory = Join-Path $PWD "supabase/.temp"
          [IO.Directory]::CreateDirectory($refDirectory) | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $refDirectory "project-ref"),
            "selftestref000000000",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Exercise encrypted backup and verifier
        shell: pwsh
        run: pnpm amora:db:test-backup
