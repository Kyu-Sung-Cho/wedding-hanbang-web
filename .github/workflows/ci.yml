name: CI

# 코드 검사는 PR과 main push에서 자동 실행한다. 수동 재검증도 유지한다.
# Code Quality는 코드 검사 결과이며 운영 릴리스 인가를 대신하지 않는다.
# 항상 실패하는 Production Readiness와 Quality Gate는 기존 계약대로 남긴다.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web_quality:
    name: Web Quality
    runs-on: ubuntu-latest
    # Typecheck, lint and production build run once alongside the test shards.
    timeout-minutes: 45

    # 독립 tsc와 Next 내부 타입 검사가 모두 약 2 GiB 기본 힙에서 OOM으로 종료됐다.
    # private ubuntu runner의 8 GB RAM에서 OS·Turbopack 공간을 남기고 이 잡만 4 GiB로 제한한다.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Placeholder values keep CI focused on static verification and build integrity.
      NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SUPABASE_EXPECTED_URL: https://abcdefghijklmnopqrst.supabase.co
      SUPABASE_EXPECTED_PROJECT_REF: abcdefghijklmnopqrst
      SUPABASE_PRODUCTION_PROJECT_REF: slrtobkksjmxgzatjyqb
      # OpenAI adapter tests inject a fake client. Keep the production cutover off in CI.
      AMORA_OPENAI_ENABLED: "false"
      RESEND_API_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://hanbang.ai
      ADMIN_PASSWORD: placeholder
      DECART_API_KEY: placeholder
      NAVER_API_HUB_CLIENT_ID: placeholder
      NAVER_API_HUB_CLIENT_SECRET: placeholder
      NAVER_CLIENT_ID: placeholder
      NAVER_CLIENT_SECRET: placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report web verification resources
        run: |
          node -e 'const os = require("node:os"); const v8 = require("node:v8"); console.log(JSON.stringify({node: process.version, cpuCount: os.availableParallelism(), totalMemoryMiB: Math.round(os.totalmem() / 1024 / 1024), heapLimitMiB: Math.round(v8.getHeapStatistics().heap_size_limit / 1024 / 1024)}));'

      - name: Web typecheck
        run: pnpm --filter @hanbang/web exec tsc --noEmit

      - name: Web lint
        run: pnpm --filter @hanbang/web exec eslint .

      - name: Web production build
        run: pnpm --filter @hanbang/web build

  web_tests:
    name: Web Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]

    env:
      # Placeholder values keep CI focused on static verification and build integrity.
      NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SUPABASE_EXPECTED_URL: https://abcdefghijklmnopqrst.supabase.co
      SUPABASE_EXPECTED_PROJECT_REF: abcdefghijklmnopqrst
      SUPABASE_PRODUCTION_PROJECT_REF: slrtobkksjmxgzatjyqb
      # OpenAI adapter tests inject a fake client. Keep the production cutover off in CI.
      AMORA_OPENAI_ENABLED: "false"
      RESEND_API_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://hanbang.ai
      ADMIN_PASSWORD: placeholder
      DECART_API_KEY: placeholder
      NAVER_API_HUB_CLIENT_ID: placeholder
      NAVER_API_HUB_CLIENT_SECRET: placeholder
      NAVER_CLIENT_ID: placeholder
      NAVER_CLIENT_SECRET: placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The web build-contract test reads pinned historical Git blobs offline.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web tests
        # Independent runners retain the release-proven PGlite worker bound.
        run: pnpm --filter @hanbang/web exec vitest run --shard=${{ matrix.shard }}/2 --maxWorkers=2

  mobile_quality:
    name: Mobile Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EXPO_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      EXPO_PUBLIC_SITE_URL: https://hanbang.ai

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mobile release readiness
        run: pnpm mobile:release-check

      - name: Mobile tests
        run: pnpm --filter @hanbang/mobile test

      - name: Mobile typecheck
        run: pnpm --filter @hanbang/mobile typecheck

      - name: Mobile lint
        run: pnpm --filter @hanbang/mobile lint

      - name: Mobile bundle export
        run: pnpm --filter @hanbang/mobile build

      - name: Shared package typecheck
        run: pnpm --filter @hanbang/shared typecheck

      - name: Shared package tests
        run: pnpm --filter @hanbang/shared test

      - name: Design tokens typecheck
        run: pnpm --filter @hanbang/design-tokens typecheck

  vendor_disclosure_quality:
    name: Vendor Disclosure Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fixed historical release fixtures read pinned Git blobs without network access.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest typecheck
        run: pnpm ingest:typecheck

      - name: Repository tests (includes ingest)
        run: pnpm test:repo

  static_release_contracts:
    name: Static Release Contracts (Non-Deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test runtime and handoff contracts (no deploy)
        run: >-
          node --test
          ./scripts/tests/amora-conversation-eval.test.mjs
          ./scripts/tests/amora-production-env.test.mjs
          ./scripts/tests/amora-runtime-env-contract.test.mjs
          ./scripts/tests/local-qa-environment.test.mjs
          ./scripts/tests/repository-handoff-docs.test.mjs
          ./scripts/tests/wedding-code-research-safety.test.mjs

      - name: Verify local manifest and migration pins (no deploy)
        run: pnpm supabase:release:fence --wedding-code-research-scene-v10

      - name: Test fail-closed release controllers (no hosted evidence)
        run: pnpm supabase:release:test

  production_readiness:
    name: "Production Readiness: BLOCKED (Hosted Evidence Required)"
    if: ${{ always() }}
    needs: [static_release_contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail closed while hosted deployment evidence is missing
        run: |
          echo "::error title=Production readiness blocked::Static contracts are not deployment evidence. A commit-bound hosted-staging RLS receipt, backup/restore evidence, storage evidence, and finalizer evidence are still required."
          echo "## Production readiness: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This CI workflow performs code and static-contract verification only. It does not deploy and does not authorize production release." >> "$GITHUB_STEP_SUMMARY"
          echo "A clean-commit hosted-staging RLS receipt plus the remaining backup, restore, storage, and finalizer evidence must be independently pinned before production." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # 파손 신호 전용 집계.
  #
  # 아래 `ci`(Quality Gate)는 production_readiness의 성공을 요구하고 그 잡은
  # 의도적으로 항상 실패한다 — "초록불을 보고 배포해도 된다고 믿는 사람이 없게"
  # 하려는 결정이고, `vendor-public-rls-probe.test.mjs`가 그 구조를 못 박고 있다.
  # 그 대가로 **이 커밋이 뭔가를 깼는지**를 알려 주는 신호가 없었다. 집계가 늘
  # 빨간불이라 개별 잡을 열어 봐야 했고, 그래서 실수를 잡는 신호로는 약했다
  # (`cebda752`가 pre-push 훅을 만든 이유).
  #
  # 그래서 차단은 그대로 두고 신호만 따로 낸다. 이 잡의 빨간불은 오직
  # "코드 검사가 깨졌다"는 뜻이다. **릴리스 인가와는 무관하다** —
  # 초록이어도 배포 가능하다는 뜻이 아니다.
  code_quality_signal:
    name: "Code Quality (breakage signal only — not a release authorization)"
    if: ${{ always() }}
    needs: [web_quality, web_tests, mobile_quality, vendor_disclosure_quality, static_release_contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report whether this commit broke a code check
        env:
          WEB_RESULT: ${{ needs.web_quality.result }}
          WEB_TESTS_RESULT: ${{ needs.web_tests.result }}
          MOBILE_RESULT: ${{ needs.mobile_quality.result }}
          VENDOR_DISCLOSURE_RESULT: ${{ needs.vendor_disclosure_quality.result }}
          STATIC_RELEASE_RESULT: ${{ needs.static_release_contracts.result }}
        run: |
          echo "Web Quality: $WEB_RESULT"
          echo "Web Tests: $WEB_TESTS_RESULT"
          echo "Mobile Quality: $MOBILE_RESULT"
          echo "Vendor Disclosure Quality: $VENDOR_DISCLOSURE_RESULT"
          echo "Static Release Contracts (Non-Deploy): $STATIC_RELEASE_RESULT"
          echo ""
          echo "This job is a breakage signal only. Production release stays BLOCKED regardless of its colour."
          if [ "$WEB_RESULT" != "success" ] || [ "$WEB_TESTS_RESULT" != "success" ] || [ "$MOBILE_RESULT" != "success" ] || [ "$VENDOR_DISCLOSURE_RESULT" != "success" ] || [ "$STATIC_RELEASE_RESULT" != "success" ]; then
            echo "A code check broke on this commit."
            exit 1
          fi

  ci:
    name: Quality Gate
    if: ${{ always() }}
    needs: [web_quality, web_tests, mobile_quality, vendor_disclosure_quality, static_release_contracts, production_readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all quality gates passed
        env:
          WEB_RESULT: ${{ needs.web_quality.result }}
          WEB_TESTS_RESULT: ${{ needs.web_tests.result }}
          MOBILE_RESULT: ${{ needs.mobile_quality.result }}
          VENDOR_DISCLOSURE_RESULT: ${{ needs.vendor_disclosure_quality.result }}
          STATIC_RELEASE_RESULT: ${{ needs.static_release_contracts.result }}
          PRODUCTION_READINESS_RESULT: ${{ needs.production_readiness.result }}
        run: |
          echo "Web Quality: $WEB_RESULT"
          echo "Web Tests: $WEB_TESTS_RESULT"
          echo "Mobile Quality: $MOBILE_RESULT"
          echo "Vendor Disclosure Quality: $VENDOR_DISCLOSURE_RESULT"
          echo "Static Release Contracts (Non-Deploy): $STATIC_RELEASE_RESULT"
          echo "Production Readiness: $PRODUCTION_READINESS_RESULT"
          if [ "$WEB_RESULT" != "success" ] || [ "$WEB_TESTS_RESULT" != "success" ] || [ "$MOBILE_RESULT" != "success" ] || [ "$VENDOR_DISCLOSURE_RESULT" != "success" ] || [ "$STATIC_RELEASE_RESULT" != "success" ] || [ "$PRODUCTION_READINESS_RESULT" != "success" ]; then
            echo "One or more required quality gates did not pass."
            exit 1
          fi
