packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "@types/react-dom": "19.1.11"
  "@xmldom/xmldom": "0.8.13"
  postcss: "8.5.14"
  "shell-quote@<=1.8.3": "1.8.4"
  "ws@<8.21.0": "8.21.0"
  "undici@<6.27.0": "6.27.0"
  "undici@>=7.0.0 <7.28.0": "7.28.0"
  "tar@<=7.5.15": "7.5.19"
  "dompurify@<=3.4.10": "3.4.11"
  "js-yaml@>=3.0.0 <3.15.0": "3.15.0"
  "js-yaml@>=4.0.0 <4.2.0": "4.3.0"
  "@babel/core@<=7.29.0": "7.29.7"
  "uuid@<11.1.1": "11.1.1"
  "brace-expansion@>=5.0.0 <5.0.6": "5.0.6"
  fast-uri: "3.1.2"

onlyBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - esbuild
  - sharp
  - unrs-resolver
