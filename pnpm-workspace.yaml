packages:
  - "apps/*"
  - "packages/*"

# image-size has no published fixed release as of 2026-08-11. These two
# advisories are ignored only because the locked 1.2.1 package is patched
# below and both upstream proof-of-concept loops are executable regression tests.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "@types/react-dom": "19.1.11"
  "@xmldom/xmldom": "0.8.13"
  postcss: "8.5.23"
  "shell-quote@<=1.8.4": "1.9.0"
  "ws@<8.21.0": "8.21.0"
  "undici@<6.28.0": "6.28.0"
  "undici@>=7.0.0 <7.29.0": "7.29.0"
  "tar@<=7.5.20": "7.5.21"
  "dompurify@<=3.4.12": "3.4.13"
  "js-yaml@>=3.0.0 <3.15.1": "3.15.1"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "nanoid@<3.3.18": "3.3.18"
  "@babel/core@<=7.29.0": "7.29.7"
  "uuid@<11.1.1": "11.1.1"
  brace-expansion: "5.0.9"
  fast-uri: "3.1.5"
  sharp: "0.35.0"

onlyBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - esbuild
  - sharp
  - unrs-resolver

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  sharp@0.35.0: patches/sharp@0.35.0.patch
