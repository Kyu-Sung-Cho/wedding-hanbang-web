packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "@types/react-dom": "19.1.11"
  "@xmldom/xmldom": "0.8.15"
  postcss: "8.5.23"
  "shell-quote@<=1.8.4": "1.9.0"
  "ws@<8.21.0": "8.21.0"
  "undici@<6.28.0": "6.28.0"
  "undici@>=7.0.0 <7.29.0": "7.29.0"
  "tar@<=7.5.20": "7.5.21"
  "dompurify@<=3.4.12": "3.4.13"
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "@babel/core@<=7.29.0": "7.29.7"
  "nanoid@<3.3.18": "3.3.18"
  "uuid@<11.1.1": "11.1.1"
  brace-expansion: "5.0.9"
  fast-uri: "3.1.7"
  browserslist: "4.28.7"
  "@humanfs/node": "0.16.8"
  fflate: "0.4.9"
  postcss-selector-parser: "6.1.3"
  decode-uri-component: "0.5.0"
  sharp: "0.35.4"

onlyBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - esbuild
  - sharp
  - unrs-resolver

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
  image-size@1.2.1: patches/image-size@1.2.1.patch
  next@16.3.4: patches/next@16.3.4.patch
