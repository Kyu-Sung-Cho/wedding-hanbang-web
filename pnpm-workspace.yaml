packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "@types/react-dom": "19.1.11"
  "@xmldom/xmldom": "0.8.13"
  postcss: "8.5.18"
  "shell-quote@<=1.8.4": "1.9.0"
  "ws@<8.21.0": "8.21.0"
  "undici@<6.27.0": "6.27.0"
  "undici@>=7.0.0 <7.28.0": "7.28.0"
  "tar@<=7.5.20": "7.5.21"
  "dompurify@<=3.4.11": "3.4.12"
  "js-yaml@>=3.0.0 <3.15.0": "3.15.0"
  "js-yaml@>=4.0.0 <4.2.0": "4.3.0"
  "@babel/core@<=7.29.0": "7.29.7"
  "uuid@<11.1.1": "11.1.1"
  brace-expansion: "5.0.8"
  fast-uri: "3.1.4"
  sharp: "0.35.0"

onlyBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - esbuild
  - sharp
  - unrs-resolver

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  sharp@0.35.0: patches/sharp@0.35.0.patch
